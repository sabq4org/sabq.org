openapi: 3.0.3
info:
  title: Sabq Bot Drafts API
  version: 1.8.0
  description: |
    مسودات لبوت «نشر سبق» ومهندّس (Grok Bot). الإنشاء draft.
    النسخة الإنجليزية تحت /api/internal/bot-drafts/en بنفس التوكن. جسم المسار العربي لا يقبل sourceArticleId.
    POST /{id}/publish ينشر فوراً. POST /{id}/schedule يجدول بـ publishAt.
    PATCH /{id}/schedule يغيّر موعد مادة مجدولة. DELETE /{id}/schedule يلغي الجدولة ويعيدها draft.
    POST /{id}/archive أرشفة ناعمة. POST /{id}/restore يعيد المؤرشفة draft دون نشر. PATCH /{id}/visibility يضبط المميز والعاجل وإخفاء الرئيسية.
    PATCH /{id}/ready ينقل المسودة إلى ready_to_publish دون نشر. POST /{id}/ready الاسم نفسه لهوية nashr-sabq فقط.
    للتوكنات الأخرى المواد القابلة للإدارة source=bot فقط، باستثناء أي خبر published أياً كان مصدره: يُقرأ عبر GET /{id}
    وGET /by-public-id/{publicId}، ويُعدَّل محتواه عبر PATCH /{id} وPOST /{id}/regenerate-extras.
    صفوف المحرر غير المنشورة تبقى 404 لتلك التوكنات. التوكن الشخصي يبقى محصوراً في صفوفه.
    هوية nashr-sabq غير الشخصية تدير أخبار العربية والإنجليزية من أي مصدر (manual وios-app وbot) في الحالات الصالحة للفعل، بلا تغيير للمصدر. الجسم الجديد يتطلب updateReason وexpectedUpdatedAt. الجسم القديم (فارغ أو operationId أو publishAt فقط) يبقى لمسار source=bot وإيصال العملية؛ وعلى خبر من المحرر يرد 422 لا 404. قفل محرر بشري يبقى 409 locked_by_editor.
    التوكن الشخصي لخبر news ذي byline صحيفة سبق لا يتطلب ترخيص مستخدم التوكن؛ تبقى صلاحيات RBAC والملكية والحصة سارية، وتبقى legacy/byline المخصصة والقنوات الأخرى خلف بوابة الترخيص القائمة.
    محرر الأخبار الموسع متاح حصرياً للتوكن القديم باسم nashr-sabq؛ تبقى صلاحيات التوكنات الأخرى كما هي.
    الدليل الكامل: docs/systems/editorial/BOT_DRAFTS_API.md
servers:
  - url: https://api.sabq.org
    description: Production (Railway)
  - url: http://localhost:5000
    description: Local dev (npm run dev)
security:
  - botToken: []
paths:
  /api/internal/bot-drafts:
    get:
      operationId: listEditorNewsAr
      summary: قائمة الأخبار لهوية nashr-sabq فقط
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 3
          description: بحث في العنوان والمتن، 3 أحرف على الأقل
            minLength: 3
          description: بحث في العنوان والمقدمة، 3 أحرف على الأقل
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - ready
              - ready_to_publish
              - scheduled
              - published
              - archived
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - manual
              - bot
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: authorId
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: قائمة وصفحة تالية اختيارية
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      items: { type: array, items: { type: object } },
                      nextCursor: { type: string, nullable: true }
                    }
                }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: الهوية غير مخوّلة }
    post:
      operationId: createSabqDraft
      summary: إنشاء مسودة عربية جديدة في لوحة تحكم سبق (status=draft)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotDraftCreate"
      responses:
        "201":
          description: المسودة أُنشئت
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDraft"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /api/internal/bot-drafts/images:
    post:
      operationId: uploadSabqDraftImage
      summary: رفع صورة واحدة إلى R2 / media.sabq.org لغلاف المسودة أو متنها (لا نشر)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
                  description: صورة واحدة JPEG/PNG/WEBP/GIF بحد أقصى 10MB
      responses:
        "201":
          description: رُفعت الصورة إلى R2 — deliveryUrl هو https://media.sabq.org/news/…
            يُمرَّر كـ imageUrl (غلاف) أو داخل imageUrls (متن)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDraftImageUpload"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: upload_failed — التخزين لم يُرجع رابط https
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: not_configured (توكنات البوت) أو storage_unavailable (R2 غير مضبوط
            — لا بديل Cloudflare Images)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/internal/bot-drafts/by-public-id/{publicId}:
    get:
      operationId: findSabqArticleByPublicId
      summary: إيجاد خبر منشور من رابطه العام /article/{publicId}
      description: >
        يطابق كما يحلّه الموقع (slug = x أو english_slug = x) مع تفضيل
        english_slug، وstatus=published فقط. يُفك ترميز URL مرة واحدة (Express)
        ثم يُقص الفراغ. نفس مصادقة GET /{id} وصلاحية read، والتوكن الشخصي محصور
        في صفوفه.
      parameters:
        - name: publicId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 300 }
          description: الجزء الأخير من https://sabq.org/article/{publicId} (englishSlug أو
            slug)
      responses:
        "200":
          description: الخبر المنشور
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotPublicArticleLookup"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: forbidden_action — توكن شخصي بلا صلاحية read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/internal/bot-drafts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: معرّف المسودة كما عاد من الإنشاء
    get:
      operationId: getSabqDraft
      summary: حالة المسودة ومعرّفها ورابط التحرير الداخلي
      description: "لـ nashr-sabq: قراءة خبر بأي حالة؛ بقية الاعتمادات تتبع قيود
        الملكية والحالة السابقة. includeContent=1 يعيد المتن."
      parameters:
        - name: includeContent
          in: query
          required: false
          description: أرسل 1 لإعادة المتن الكنسي المخزّن كـ HTML. القيمة الافتراضية لا
            تعيد المتن؛ القيم الأخرى والمصفوفات مرفوضة.
          schema: { type: string, enum: [ "1" ] }
      responses:
        "200":
          description: المسودة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDraft"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateSabqDraft
      summary: تعديل الخبر حسب صلاحية الاعتماد وحالته
      description: nashr-sabq يستخدم BotNewsEditorUpdate على draft وready_to_publish
        وscheduled وpublished. التوكنات الأخرى تستخدم العقد السابق؛ المؤرشف
        يستعاد أولاً. المصدر لا يتغير؛ يسمح للمحرر بتعديل الإسناد لحساب تحريري
        نشط.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/BotDraftUpdate"
                - $ref: "#/components/schemas/BotNewsEditorUpdate"
      responses:
        "200":
          description: المسودة بعد التحديث
          content:
            application/json:
              schema:
                description: مادة محدّثة؛ حقول nashr-sabq ترجع صف المادة بعد التحديث
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                      - draft
                      - ready_to_publish
                      - scheduled
                      - published
                  title:
                    type: string
                  content:
                    type: string
                  updatedAt:
                    type: string
                    format: date-time
                  authorId:
                    type: string
                  reporterId:
                    type: string
                    nullable: true
                  source:
                    type: string
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: not_a_draft (صف source=bot ليس draft ولا published، مثل الجاهزة أو
            المجدولة أو المؤرشفة) أو locked_by_editor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "403":
          description: forbidden_action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: generation_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: الخدمة غير متاحة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/internal/bot-drafts/{id}/ready:
    patch:
      operationId: markSabqDraftReady
      summary: تعليم المسودة جاهزة للنشر (draft → ready_to_publish) دون نشر. nashr-sabq يقبل أي مصدر بجسم updateReason وexpectedUpdatedAt
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: جسم فارغ. أي حقل يُرفض، وحقل ممنوع مثل status يُرفض 422.
      responses:
        "200":
          description: أصبحت ready_to_publish وupdatable=false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDraft"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: not_a_draft (ليست draft، بما فيها الجاهزة مسبقاً أو المنشورة) أو
            locked_by_editor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/internal/bot-drafts/{id}/publish:
    post:
      operationId: publishSabqDraft
      summary: نشر فوري. توكنات source=bot من draft أو ready_to_publish بجسم فارغ. nashr-sabq من أي مصدر وحالة draft أو ready_to_publish أو scheduled
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: >-
                جسم فارغ أو operationId فقط. sensitiveOverride وoverrideReason
                مقبولان من عملاء قدامى ويُتجاهلان؛ شارة الحساسية لا تمنع النشر.
                أي حقل آخر يُرفض. status أو authorId يُرفضان 422.
              properties:
                operationId:
                  {
                    type: string,
                    format: uuid,
                    description: معرّف عملية ثابت لإعادة المحاولة الآمنة وقراءة الإيصال
                  }
                sensitiveOverride: { type: boolean, deprecated: true, description: يُتجاهل }
                overrideReason: { type: string, maxLength: 500, deprecated: true, description: يُتجاهل }
      responses:
        "200":
          description: نُشرت أو أعيدت نتيجة الإيصال. مع operationId يعاد {operationId,
            articleId, action, status=succeeded, response}; failed يعني
            not_applied فقط.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BotDraft"
                  - $ref: "#/components/schemas/BotDraftPublishOperation"
        "202":
          description: العملية قيد التنفيذ أو نتيجتها غير محسومة؛ لا تُعاد محاولة النشر
            تلقائياً
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDraftPublishOperation"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: license_required إن كان byline غير مؤسسي بلا ترخيص. التوكن الشخصي
            لخبر news ذي byline صحيفة سبق لا يطلب ترخيص مستخدم التوكن. PATCH على
            هذا المسار forbidden_action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: not_a_draft (ليست draft ولا ready_to_publish) أو locked_by_editor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/internal/bot-drafts/{id}/operations/{operationId}:
    get:
      operationId: getSabqDraftPublishOperation
      summary: قراءة إيصال عملية نشر بوت
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: operationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: processing أو succeeded أو failed؛ الفشل المؤكد يحمل
            executionOutcome=not_applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDraftPublishOperation"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/internal/bot-drafts/{id}/schedule:
    post:
      operationId: scheduleSabqDraft
      summary: جدولة مسودة بوت حتى يلتقطها ناشر المواد المجدولة
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ publishAt ]
              properties:
                publishAt:
                  type: string
                  format: date-time
                  description: ISO-8601 مستقبلي مع منطقة زمنية. الرياض +03:00 أو ما يعادله UTC.
                    بلا إزاحة أو في الماضي = 400.
                  example: "2026-09-24T18:30:00+03:00"
      responses:
        "200":
          description: جُدولت. status=scheduled وscheduledAt وeditUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDraft"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: license_required إن كان byline غير مؤسسي بلا ترخيص. التوكن الشخصي
            لخبر news ذي byline صحيفة سبق لا يطلب ترخيص مستخدم التوكن
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: not_a_draft أو locked_by_editor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      operationId: rescheduleSabqDraft
      summary: تغيير موعد مادة بوت مجدولة
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ publishAt ]
              properties:
                publishAt:
                  type: string
                  format: date-time
                  example: "2026-09-24T21:00:00+03:00"
      responses:
        "200":
          description: بقي status=scheduled وتبدّل scheduledAt. لا إعادة لتنبيه الجدولة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDraft"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: not_scheduled أو locked_by_editor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: unscheduleSabqDraft
      summary: إلغاء الجدولة وإعادة المادة مسودة دون حذف
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: status=draft وupdatable=true وscheduledAt=null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDraft"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: not_scheduled أو locked_by_editor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/internal/bot-drafts/{id}/archive:
    post:
      operationId: archiveSabqDraft
      summary: أرشفة ناعمة لمادة بوت منشورة (لا حذف من القاعدة)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 1000
                  description: سبب اختياري يدخله المستخدم فقط؛ يُحفظ بعد trim في reviewNotes ويظهر
                    في article_events وسجل النشاط
      responses:
        "200":
          description: status=archived. تختفي من الموقع والرئيسية والخلاصات والخرائط
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDraft"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: not_published أو locked_by_editor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/internal/bot-drafts/{id}/restore:
    post:
      operationId: restoreSabqDraft
      summary: استعادة مادة بوت مؤرشفة إلى مسودة دون نشر
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: status=draft وupdatable=true وscheduledAt=null. لا نشر
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDraft"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: not_archived أو locked_by_editor
