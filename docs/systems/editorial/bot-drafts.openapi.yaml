        "202": { description: بدأت العملية. jobId وstatus وusedToday وdailyCap }
        "400": { description: طلب غير صالح }
        "403": { description: "الهوية غير مخوّلة أو capability_disabled" }
        "429": { description: "daily_cap_reached أو rate_limited" }
        "503": { description: "not_configured: OPENAI_IMAGES_API_KEY غير مضبوط" }
  /api/internal/bot-drafts/en/images/generate-gpt/{jobId}:
    get:
      operationId: getGptImageEn
      summary: حالة توليد صورة GPT (processing/completed/failed) ورابط الصورة عند الاكتمال
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: الحالة }
        "404": { description: عملية غير موجودة }
  /api/internal/bot-drafts/en/images/edit:
    post:
      operationId: editImageEn
      summary: تعديل صورة موجودة على سبق بتعليمات نصية وحفظ النتيجة في المكتبة (nashr-sabq فقط)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { type: object, additionalProperties: false, required: [ sourceImageUrl, prompt ], properties: { sourceImageUrl: { type: string, format: uri, description: "رابط https على media.sabq.org أو Cloudflare Images فقط" }, prompt: { type: string, minLength: 3, maxLength: 2000 }, aspectRatio: { type: string, enum: [ "1:1", "16:9", "4:3", "9:16", "21:9", "3:4" ] } } }
      responses:
        "201": { description: "deliveryUrl وmedia وisAiGenerated وmodel" }
        "422": { description: مصدر غير مسموح أو صورة غير صالحة }
        "502": { description: فشل التوليد }
  /api/internal/bot-drafts/en/media/{mediaId}:
    delete:
      operationId: deleteMediaEn
      summary: حذف ملف من المكتبة (nashr-sabq فقط). لما رفعه/ولّده البوت وغير المستخدم؛ الملف الفعلي يبقى في التخزين ولقطة الصف في bot_editor_operations
      parameters:
        - { name: mediaId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { type: object, additionalProperties: false, required: [ updateReason ], properties: { updateReason: { type: string, minLength: 3, maxLength: 500 } } }
      responses:
        "200": { description: "deleted: true" }
        "403": { description: ملف ليس للبوت }
        "404": { description: غير موجود }
        "409": { description: الملف مستخدم في مادة }
  /api/internal/bot-drafts/en/ai/titles:
    post:
      operationId: aiTitlesEn
      summary: عناوين مقترحة (لا تُحفظ). articleId أو content (واحد فقط) وlanguage اختياري (nashr-sabq فقط)
      responses:
        "200": { description: "{ titles: string[] }" }
        "422": { description: المتن قصير }
  /api/internal/bot-drafts/en/ai/proofread:
    post:
      operationId: aiProofreadEn
      summary: تدقيق لغوي لمتن أو عنوان بلا تعديل أي مادة. واحد من articleId أو content أو title (nashr-sabq فقط)
      responses:
        "200": { description: نتيجة التدقيق }
  /api/internal/bot-drafts/en/ai/compare-headlines:
    post:
      operationId: aiCompareHeadlinesEn
      summary: مقارنة عناوين من ثلاثة نماذج (تكلفة أعلى). articleId أو content (واحد فقط) وcurrentTitle اختياري (nashr-sabq فقط)
      responses:
        "200": { description: "{ suggestions: [{provider, model, title, error?}] }" }
  /api/internal/bot-drafts/opinion/drafts:
    get:
      operationId: opinionBoardEditorNews
      summary: لوحة مقالات الرأي المسطّحة (nashr-sabq فقط؛ opinion.read)
      parameters:
        - { name: weekStart, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200": { description: "board + items" }
        "403": { description: "غير مخوّل أو capability_disabled" }
  /api/internal/bot-drafts/opinion/drafts/{id}:
    get:
      operationId: opinionDetailEditorNews
      summary: تفاصيل مقال رأي (item, nextSlot, draft, warnings, prep) (nashr-sabq فقط)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: التفاصيل }
        "404": { description: غير موجود }
    patch:
      operationId: opinionEditEditorNews
      summary: تعديل عنوان/متن مسودة رأي بانتظار المكتب أو مجدول (opinion.edit). 423 للمواد المحمية
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { type: object, additionalProperties: false, properties: { title: { type: string }, content: { type: string, minLength: 20 }, contentFormat: { type: string, enum: [ html, text ] } } }
      responses:
        "200": { description: "التفاصيل + changed + changedFields" }
        "409": { description: تعارض الحالة أو القفل }
        "423": { description: مادة محمية }
  /api/internal/bot-drafts/opinion/drafts/{id}/prepare:
    post:
      operationId: opinionPrepareEditorNews
      summary: «جهّز وجدول» لمقال رأي (opinion.lifecycle). 202 ثم GET للمتابعة
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202": { description: "{ job, created }" }
        "423": { description: مادة محمية }
    get:
      operationId: opinionPrepareStatusEditorNews
      summary: حالة التجهيز
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ job }" }
        "404": { description: لا يوجد تجهيز }
  /api/internal/bot-drafts/opinion/drafts/{id}/image:
    post:
      operationId: opinionImageEditorNews
      summary: توليد صورة مقال الرأي (opinion.image). 202 بدأ، 200 إن وُجدت صورة ولم يُرسل force
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "skipped: image_exists" }
        "202": { description: "{ job, created }" }
        "423": { description: مادة محمية }
    get:
      operationId: opinionImageStatusEditorNews
      summary: حالة توليد صورة الرأي
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ job }" }
        "404": { description: لا يوجد توليد }
  /api/internal/bot-drafts/opinion/drafts/{id}/slot-check:
    get:
      operationId: opinionSlotCheckEditorNews
      summary: فحص تعارض موعد الجدولة (scheduledAt ISO مع المنطقة)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: scheduledAt, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200": { description: "{ scheduledAt, warnings }" }
  /api/internal/bot-drafts/opinion/drafts/{id}/schedule:
    post:
      operationId: opinionScheduleEditorNews
      summary: جدولة مقال رأي. جسم فارغ = موعد الكاتب الثابت أو scheduledAt (opinion.lifecycle)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ article, scheduledAt, warnings }" }
        "423": { description: مادة محمية }
  /api/internal/bot-drafts/opinion/drafts/{id}/publish:
    post:
      operationId: opinionPublishEditorNews
      summary: نشر فوري لمقال رأي (جسم فارغ) (opinion.lifecycle)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ article }" }
        "409": { description: منشور أصلاً أو لم يعد بانتظار المكتب }
        "423": { description: مادة محمية }
  /api/internal/bot-drafts/opinion/drafts/{id}/return:
    post:
      operationId: opinionReturnEditorNews
      summary: إرجاع مقال رأي للكاتب بملاحظة 3–2000 حرف (opinion.lifecycle)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { type: object, additionalProperties: false, required: [ note ], properties: { note: { type: string, minLength: 3, maxLength: 2000 } } }
      responses:
        "200": { description: "{ article }" }
        "423": { description: مادة محمية }
  /api/internal/bot-drafts/opinion/published/{id}:
    patch:
      operationId: opinionPublishedEditEditorNews
      summary: تحرير مقال رأي منشور (opinion.edit_published؛ nashr-sabq فقط). expectedUpdatedAt وupdateReason إلزاميان
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ expectedUpdatedAt, updateReason ]
              description: حقول PATCH /{id} (title, content, excerpt, imageUrl, tagIds, seo…) مع الحقلين الإلزاميين. authorId وreporterId وsourceArticleId ممنوعة.
              properties:
                expectedUpdatedAt: { type: string, format: date-time }
                updateReason: { type: string, minLength: 3, maxLength: 500 }
                title: { type: string }
                content: { type: string }
                contentFormat: { type: string, enum: [ html, text ] }
                excerpt: { type: string, nullable: true }
      responses:
        "200": { description: "المسودة بعد التعديل (status يبقى published)" }
        "403": { description: "ليس opinion، أو توكن آخر، أو capability_disabled" }
        "409": { description: "draft_changed (إصدار قديم) أو not_published" }
        "422": { description: "expectedUpdatedAt/updateReason ناقصان أو حقول ممنوعة" }
        "423": { description: مادة محمية }
components:
  securitySchemes:
    botToken:
      type: http
      scheme: bearer
      description: توكن البوت من BOT_DRAFTS_API_TOKENS (Railway). يُخزَّن في مدير
        أسرار البوت باسم SABQ_BOT_DRAFTS_TOKEN.
  parameters:
    ArticleId:
      name: id
      in: path
      required: true
      schema: { type: string }
    PublicId:
      name: publicId
      in: path
      required: true
      schema: { type: string, maxLength: 300 }
  schemas:
    DraftFields:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 300, description: عنوان الخبر }
        content:
          {
            type: string,
            minLength: 20,
            maxLength: 300000,
            description: HTML أو نص خام (يتحول لفقرات). وسوم img https تُعاد كتابتها لشكل
              محرر TipTap
          }
        contentFormat: { type: string, enum: [ html, text ] }
        subtitle:
          type: string
          maxLength: 300
          nullable: true
          description: مع publish_first_validation (الافتراضي مفعّل) السقف الفعلي 120 ويرد
            422 subtitle_too_long. إطفاء العلم يعيد 300.
        riskLabel:
          type: string
          nullable: true
          enum: [ safe, needs_look, sensitive ]
          description: شارة المخاطر معلوماتية فقط؛ لا تمنع النشر ولا الجدولة ولا التصحيح.
        updateReason:
          type: string
          maxLength: 500
          nullable: true
          description: سبب التحديث على خبر منشور. يظهر للقارئ إن كان علم سطر التحديث
            مفعّلاً.
        excerpt:
          {
            type: string,
            maxLength: 1000,
            nullable: true,
            description: المقدمة/الموجز
          }
        seoTitle:
          {
            type: string,
            maxLength: 70,
            nullable: true,
            description: يُحفظ في seo.metaTitle؛ غيابه يحافظ على القيمة وnull/الفارغ يمسحها
          }
        seoDescription:
          {
            type: string,
            maxLength: 160,
            nullable: true,
            description: يُحفظ في seo.metaDescription؛ غيابه يحافظ على القيمة وnull/الفارغ
              يمسحها
          }
        categoryId: { type: string }
        categorySlug:
          {
            type: string,
            description: slug تصنيف منشور (status=visible في الإنتاج؛ يُقبل active تاريخياً)
              من GET /api/categories
          }
        imageUrl:
          {
            type: string,
            format: uri,
            nullable: true,
            description: صورة الغلاف فقط — https. لا تُنسخ إلى المتن
          }
        imageUrls:
          type: array
          maxItems: 20
          description: صور المتن. تُلحَق أسفل الجسم كوسوم img بنفس عقد محرر TipTap (ليست
            ألبوماً). يُفضَّل deliveryUrl من POST /images
          items: { type: string, format: uri }
        keywords:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 60 }
        sourceUrl: { type: string, format: uri, nullable: true }
        clientReference: { type: string, maxLength: 120, description: معرّف البوت الداخلي للمادة }
        notes:
          {
            type: string,
            maxLength: 2000,
            nullable: true,
            description: ملاحظة للمحررين
          }
      additionalProperties: false
    BotDraftCreate:
      allOf:
        - $ref: "#/components/schemas/DraftFields"
        - required: [ title, content ]
    BotDraftUpdate:
      description: >
        نفس حقول الإنشاء وكلها اختيارية وحقل واحد على الأقل. على خبر published
        مصدره bot كل الحقول مسموحة ما عدا clientReference وnotes (422
        forbidden_fields). imageUrls تُلحق أسفل المتن بلا تكرار،
        وcategorySlug/categoryId ينقل التصنيف (غير موجود → 422
        category_not_found). status وpublishedAt وslug لا تُكتب.
      allOf:
        - $ref: "#/components/schemas/DraftFields"
        - minProperties: 1
    EnBotDraftCreate:
      description: جسم المسار الإنجليزي. sourceArticleId اختياري ويرفضه المسار العربي.
      allOf:
        - $ref: "#/components/schemas/DraftFields"
        - type: object
          required: [ title, content ]
          properties:
            sourceArticleId:
              type: string
              nullable: true
              maxLength: 64
              description: معرّف الخبر العربي الأصلي في articles
    EnBotDraftUpdate:
      allOf:
        - $ref: "#/components/schemas/EnBotDraftCreate"
        - minProperties: 1
    EnBotDraft:
      description: نفس BotDraft مع sourceArticleId وpublicUrl على /en/article/{englishSlug}
      allOf:
        - $ref: "#/components/schemas/BotDraft"
        - type: object
          properties:
            sourceArticleId: { type: string, nullable: true }
    RegenerateExtras:
      type: object
      additionalProperties: false
      properties:
        fields:
          type: array
          minItems: 1
          items: { type: string, enum: [ summary, keywords, seo ] }
    RegenerateExtrasResult:
      type: object
      properties:
        draft: { $ref: "#/components/schemas/EnBotDraft" }
        regenerated: { type: object }
    PublishBody:
      type: object
      additionalProperties: false
      properties:
        operationId: { type: string, format: uuid }
        sensitiveOverride: { type: boolean, description: مقبول ويُتجاهل }
        overrideReason: { type: string, maxLength: 500 }
    ScheduleBody:
      type: object
      additionalProperties: false
      required: [ publishAt ]
      properties:
        publishAt:
          {
            type: string,
            description: "ISO-8601 مع إزاحة، مثال 2026-12-01T18:30:00+03:00"
          }
    ArchiveBody:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 1000 }
    VisibilityBody:
      type: object
      additionalProperties: false
      properties:
        isFeatured: { type: boolean }
        newsType: { type: string, enum: [ breaking, regular ] }
        hideFromHomepage: { type: boolean }
    PublishOperation:
      $ref: "#/components/schemas/BotDraftPublishOperation"
    BotPublicArticleLookup:
      type: object
      required:
        [
          id,
          status,
          title,
          slug,
          englishSlug,
          source,
          categorySlug,
          publishedAt,
          updatedAt,
          publicUrl,
          updatable
        ]
      properties:
        id: { type: string }
        status: { type: string, enum: [ published ] }
        title: { type: string }
        slug: { type: string }
        englishSlug: { type: string, nullable: true }
        source:
          {
            type: string,
            nullable: true,
            description: مصدر الصف الأصلي (bot أو manual أو email …)
          }
        categorySlug: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
        publicUrl: { type: string, nullable: true }
        updatable: { type: boolean, description: true دائماً للخبر المنشور }
    BotDraft:
      type: object
      properties:
        id: { type: string }
        status:
          {
            type: string,
            description: الحالة الحالية في اللوحة
              (draft/ready_to_publish/published/scheduled/archived)
          }
        updatable:
          {
            type: boolean,
            description: true لمسودة بوت draft ولأي خبر published أياً كان مصدره. false بعد
              الجاهزية أو الجدولة أو الأرشفة. إلغاء الجدولة يعيدها true
          }
        title: { type: string }
        content:
          {
            type: string,
            description: يظهر فقط في GET مع includeContent=1، وهو HTML الكنسي المخزّن
          }
        contentFormat:
          {
            type: string,
            enum: [ html ],
            description: يظهر مع content في GET مع includeContent=1 فقط
          }
        subtitle: { type: string, nullable: true }
        slug: { type: string }
        excerpt: { type: string, nullable: true }
        seoTitle: { type: string, nullable: true, description: articles.seo.metaTitle }
        seoDescription: { type: string, nullable: true, description: articles.seo.metaDescription }
        categoryId: { type: string, nullable: true }
        categorySlug: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        bodyImageUrls:
          type: array
          description: روابط صور المتن بالترتيب. الغلاف لا يدخل إلا إذا وُضع في الجسم.
            المتن نفسه لا يُعاد
          items: { type: string, format: uri }
        sourceUrl: { type: string, nullable: true }
        keywords: { type: array, items: { type: string } }
        source: { type: string, example: bot }
        bot: { type: string, nullable: true, description: اسم البوت من التوكن }
        clientReference: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        editUrl: { type: string, format: uri, description: رابط التحرير الداخلي في اللوحة }
        previewUrl: { type: string, format: uri }
        publicUrl:
          type: string
          format: uri
          nullable: true
          description: رابط القارئ https://sabq.org/article/{englishSlug}. الصفحة العامة
            تعرضه عندما status=published. أثناء scheduled نفس الرابط يُفتح بعد
            الموعد.
        publishedAt: { type: string, format: date-time, nullable: true }
        scheduledAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: موعد الجدولة المؤكد
          }
        isFeatured: { type: boolean, description: مميز }
        newsType: { type: string, description: breaking أو regular }
        hideFromHomepage: { type: boolean, description: مخفي من الرئيسية }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BotDraftImageUpload:
      type: object
      required: [ deliveryUrl, purpose ]
      properties:
        deliveryUrl:
          {
            type: string,
            format: uri,
            description: "رابط R2 العام https://media.sabq.org/news/… لتمريره كـ imageUrl (غلاف) أو داخل imageUrls (متن)"
          }
        imageId: { type: string, nullable: true }
        filename: { type: string }
        provider: { type: string, nullable: true, description: r2 دائماً على هذا المسار }
        thumbnailUrl: { type: string, format: uri, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        purpose: { type: string, example: bot-article-image }
    BotDraftPublishOperation:
      type: object
      required: [ operationId, articleId, action, status ]
      properties:
        operationId: { type: string, format: uuid }
        articleId: { type: string }
        action: { type: string, enum: [ publish ] }
        status: { type: string, enum: [ processing, succeeded, failed ] }
        response: { $ref: "#/components/schemas/BotDraft" }
        error:
          type: object
          required: [ code, message ]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
        executionOutcome:
          {
            type: string,
            enum: [ not_applied ],
            description: يظهر فقط عند فشل مؤكد قبل الكتابة
          }
    Error:
      type: object
      required: [ code, message ]
      properties:
        code:
          type: string
          description: رمز الخطأ، مثل validation_error أو invalid_input أو
            locked_by_editor أو draft_changed أو forbidden_action أو
            push_not_found
        message: { type: string }
        details: {}
    BotNewsEditorUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: حصري لـ nashr-sabq؛ sourceArticleId للإنجليزية فقط، وnotes
        وclientReference وinfographic غير قابلة للتعديل بعد النشر. status
        والمصدر غير قابلين للتعديل. authorId وreporterId يتطلبان حساباً تحريرياً
        نشطاً.
      properties:
        title:
          type: string
          maxLength: 300
          minLength: 3
        authorId:
          type: string
          maxLength: 64
          minLength: 1
        reporterId:
          type: string
          maxLength: 64
          minLength: 1
          nullable: true
        subtitle:
          type: string
          maxLength: 300
          nullable: true
        content:
          type: string
          maxLength: 300000
          minLength: 20
        contentFormat:
          type: string
          enum:
            - html
            - text
        excerpt:
          type: string
          maxLength: 1000
          nullable: true
        categoryId:
          type: string
          maxLength: 64
          minLength: 1
        categorySlug:
          type: string
          maxLength: 150
          minLength: 1
        imageUrl:
          type: string
          format: uri
          maxLength: 2000
          pattern: ^https://
          nullable: true
        isAiGeneratedImage:
          type: boolean
        infographic:
          type: boolean
