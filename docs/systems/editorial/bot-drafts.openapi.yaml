    post:
      operationId: generateImageArEditorNews
      summary: توليد صورة وحفظها (nashr-sabq فقط)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                additionalProperties: false,
                required: [ prompt ],
                properties:
                  {
                    prompt: { type: string, minLength: 3, maxLength: 2000 },
                    style: { type: string, maxLength: 200 },
                    aspectRatio: { type: string, enum: [ "1:1", "16:9", "4:3", "9:16", "21:9", "3:4" ] },
                    intent: { type: string, enum: [ realistic, illustration, explanatory ], description: "realistic=صورة واقعية، illustration=رسم/كاريكاتير، explanatory=إنفوجرافيك توضيحي" },
                    model: { type: string, enum: [ gemini-nano-banana-2.1, gemini-3-pro-image-preview, recraft-v3, flux-1.1-pro, ideogram-2 ] },
                    styleSlug: { type: string, maxLength: 50, pattern: "^[a-z0-9-]+$", description: "نمط من لوحة الأنماط (image_styles)" }
                  }
              }
      responses:
        "400": { description: طلب غير صالح }
        "401": { description: توكن غير صالح }
        "403": { description: الهوية غير مخوّلة }
        "404": { description: الخبر غير موجود }
        "409": { description: تعارض الحالة أو القفل أو محاولة دفع سابقة }
        "422": { description: بيانات أو حالة غير مدعومة }
        "429": { description: السعة مشغولة أو تجاوز المعدل }
        "502": { description: فشل التوليد أو الخدمة }
        "503": { description: الخدمة غير متاحة }
        "201":
          description: الصورة محفوظة
          content:
            application/json:
              schema:
                type: object
                required:
                  - deliveryUrl
                  - media
                  - isAiGenerated
                  - model
                properties:
                  deliveryUrl:
                    type: string
                    format: uri
                    maxLength: 2000
                    pattern: ^https://
                  media:
                    type: object
                  isAiGenerated:
                    type: boolean
                    enum:
                      - true
                  model:
                    type: string
      description: prompt مطلوب، 16:9 افتراضياً. الرد 201 بصورة محفوظة؛ أخطاء 400
        invalid_input و502 generation_failed.
