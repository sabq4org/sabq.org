        يثبت وصول الأجهزة.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: pushId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: إيصال الإرسال
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  language:
                    type: string
                    enum:
                      - ar
                      - en
                  article_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - sending
                      - sent
                      - partial
                      - failed
                      - delivery_unknown
                  total_devices:
                    type: integer
                  sent_count:
                    type: integer
                  failed_count:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        "400":
          description: invalid_push_id أو invalid_article_id
        "401":
          description: unauthorized
        "403":
          description: forbidden_action
        "404":
          description: push_not_found
