        "200":
          description: المادة والقيم المولدة
          content:
            application/json:
              schema:
                type: object
                required:
                  - draft
                  - regenerated
                properties:
                  draft:
                    type: object
                  regenerated:
                    type: object
                    properties:
                      fields:
                        type: array
                        items:
                          type: string
                          enum:
                            - summary
                            - keywords
                            - seo
                            - subtitle
                            - excerpt
                            - alternativeTitle
                            - seoTitle
                            - seoDescription
                      excerpt:
                        type: string
                      subtitle:
                        type: string
                      alternativeTitle:
                        type: string
                      keywords:
                        type: array
