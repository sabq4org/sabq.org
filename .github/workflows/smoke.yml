name: Smoke (production)

# Read-only smoke tests against the live site (sabq.org).
# - Runs every 6 hours as synthetic monitoring.
# - Runs after a push to main (deploys go out from main via Pages/Railway);
#   the wait step gives the deploy a head start.
# - Can be run manually against any URL (e.g. a preview deployment).
#
# These tests never log in and never write — see e2e/smoke.spec.ts.

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to smoke-test"
        required: false
        default: "https://sabq.org"
      api_base_url:
        description: "API origin for the read-only health probe"
        required: false
        default: "https://api.sabq.org"

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Wait for deploy to settle (push to main only)
        if: github.event_name == 'push'
        run: sleep 180

      - name: Run smoke tests
        run: npx playwright test e2e/smoke.spec.ts
        env:
          PW_BASE_URL: ${{ github.event.inputs.base_url || 'https://sabq.org' }}
          PW_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://api.sabq.org' }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
