name: Smoke (production)

# Read-only smoke tests against the live site (sabq.org).
# - Runs every 6 hours as synthetic monitoring.
# - Runs after Railway reports a successful production deployment.
# - Can be run manually against any URL (e.g. a preview deployment).
#
# These tests never log in and never write — see e2e/smoke.spec.ts.

on:
  schedule:
    - cron: "17 */6 * * *"
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to smoke-test"
        required: false
        default: "https://sabq.org"

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event.deployment.id || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright smoke
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'sabq.org / production' &&
       github.event.deployment.creator.login == 'railway-app[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test e2e/smoke.spec.ts
        env:
          PW_BASE_URL: ${{ github.event.inputs.base_url || 'https://sabq.org' }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
