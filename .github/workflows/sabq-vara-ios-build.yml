name: Sabq and VARA iOS build
on:
  workflow_dispatch:
  pull_request:
    paths: ['sabq app ios/**', 'sports app ios/**', '.github/workflows/sabq-vara-ios-build.yml']
  push:
    branches: [main]
    paths: ['sabq app ios/**', 'sports app ios/**', '.github/workflows/sabq-vara-ios-build.yml']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: sabq app ios/sabq.xcodeproj
            scheme: sabq
          - project: sports app ios/SabqSports.xcodeproj
            scheme: SabqSports
    steps:
      - uses: actions/checkout@v6
      - name: Xcode version
        run: xcodebuild -version
      - name: Compile app and extensions without signing
        env:
          IOS_PROJECT: ${{ matrix.project }}
          IOS_SCHEME: ${{ matrix.scheme }}
        run: xcodebuild -project "$IOS_PROJECT" -scheme "$IOS_SCHEME" -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
