name: Gulf Cup iOS build

on:
  pull_request:
    paths:
      - 'gulf-cup app ios/**'
  push:
    branches: [main]
    paths:
      - 'gulf-cup app ios/**'

jobs:
  xcodebuild:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # أحدث Xcode 16.x على الصورة — تثبيت 16.2 حرفيًا يكسر actool لأن GitHub
      # أزالت محاكي iOS 18.2 من macos-15 (actool يتحقق من وجود runtime مطابق
      # حتى في بناء الأجهزة). المشروع متوافق مع 16.2 وما فوق.
      - name: Select Xcode (latest 16.x)
        run: |
          XCODE=$(ls -d /Applications/Xcode_16.*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          echo "Selected: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Ensure iOS platform (actool / asset catalog)
        run: xcodebuild -downloadPlatform iOS || true

      - name: Build GulfCup (device)
        working-directory: gulf-cup app ios
        run: |
          chmod +x scripts/build.sh
          # generic iOS — لا يحتاج runtime محاكي مُثبَّت على GitHub macos-15
          DEST="generic/platform=iOS" ./scripts/build.sh
