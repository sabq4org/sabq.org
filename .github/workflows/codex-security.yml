name: Codex Security (advisory)

# Contextual security review for trusted pull requests. This is deliberately
# separate from security.yml: Gitleaks, npm audit, and Semgrep remain in place.
# The pilot is report-only and never patches source code.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read

concurrency:
  group: codex-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-security:
    name: Review PR changes (advisory)
    if: >-
      vars.CODEX_SECURITY_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Install the trusted scanner before repository-controlled files exist in
      # the workspace. Action revisions are pinned to immutable commits.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install Codex Security
        run: |
          set -euo pipefail
          npm install \
            --prefix "$RUNNER_TEMP/codex-security" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "@openai/codex-security@0.1.1"

      - name: Verify Codex Security
        env:
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
        run: |
          set -euo pipefail
          test -x "$CODEX_SECURITY_BIN"
          "$CODEX_SECURITY_BIN" --version

      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan pull-request changes
        id: scan
        continue-on-error: true
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_COST_USD: ${{ vars.CODEX_SECURITY_MAX_COST_USD || '5' }}
          SCAN_DIR: ${{ runner.temp }}/codex-security-results
        run: |
          set -euo pipefail
          BASE_REVISION="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          "$CODEX_SECURITY_BIN" scan . \
            --diff "$BASE_REVISION" \
            --head "$HEAD_SHA" \
            --knowledge-base docs/security/threat_model.md \
            --knowledge-base docs/architecture/AUTHENTICATION_FLOW.md \
            --knowledge-base docs/systems/auth-rbac/SYSTEM.md \
            --knowledge-base docs/DEPLOYMENT_STATUS.md \
            --output-dir "$SCAN_DIR" \
            --max-cost "$MAX_COST_USD" \
            --json > "$RUNNER_TEMP/codex-security.json"

      - name: Preserve private scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-security-results-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/codex-security-results
            ${{ runner.temp }}/codex-security.json
          if-no-files-found: warn
          retention-days: 3

      - name: Write advisory summary
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          {
            echo "## Codex Security pilot"
            echo
            echo "- Scan step outcome: \`$SCAN_OUTCOME\`"
            echo "- Enforcement: advisory only; no source changes or automatic patches"
            echo "- Results: private workflow artifact retained for 3 days"
            echo "- Fix policy: validate workflow impact using docs/security/CODEX_SECURITY_OPERATING_MODEL.md"
          } >> "$GITHUB_STEP_SUMMARY"
