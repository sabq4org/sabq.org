name: Security scan

# SAST + secret + dependency scanning. Runs on PRs, pushes to main, and weekly.
# NOTE: CodeQL is intentionally NOT used — it requires GitHub Advanced Security,
# which this private repo's plan doesn't include. Semgrep (public rulesets)
# gives equivalent SAST coverage with no paid add-on.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gitleaks CLI directly (the org action needs a license key). Scans the
      # working tree (--no-git) so it catches secrets in the CURRENT code without
      # failing on the historical prompt-studio value already removed from source.
      # A finding fails the job — this is the one gate we want strict from day one.
      - name: Run gitleaks
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact --verbose --exit-code 1

  dependencies:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Reports high/critical advisories in production deps. Non-blocking for now
      # (a backlog exists); Dependabot opens the fix PRs. Flip continue-on-error
      # to false once the backlog is cleared to make this a hard gate.
      - name: npm audit (production deps)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # Public rulesets (no token). Report-only on the first pass to avoid
      # blocking on legacy findings; tighten with --error once triaged.
      - name: Semgrep scan
        continue-on-error: true
        run: >
          semgrep scan
          --config p/security-audit
          --config p/javascript
          --config p/typescript
          --config p/secrets
          --metrics off
