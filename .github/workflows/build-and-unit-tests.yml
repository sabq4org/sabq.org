name: Build + unit tests

# Milestone 0 of the 2026-06-10 audit: a PR must not merge if it breaks the
# server/client build or any unit test. Complements typecheck.yml (tsc) and
# lint.yml (changed-files ESLint) — together these four are the merge gate.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: vitest + esbuild + vite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: audit_local
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U audit_local"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest)
        env:
          SESSION_REVOCATION_TEST_URL: postgresql://audit_local:local_test_only@127.0.0.1:5432/postgres
        run: npm run test:unit

      - name: SSR view tests
        run: npm run test:web-next

      - name: Server build (esbuild)
        run: npm run build:server

      - name: Client build (vite)
        # Node 24 default heap is not enough for the 5.7k-module Vite bundle on CI runners.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build:client
