name: Typecheck

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript (npm run check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # tsc on this codebase (251 tables, ~37k-line routes.ts) exceeds Node's
        # default old-space limit on the runner and OOMs (exit 134). The
        # ubuntu-latest runner has 16GB, so raise the heap generously.
        run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
