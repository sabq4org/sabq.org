name: Typecheck

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript (npm run check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # TypeScript 7 (native) is the default `tsc` via @typescript/native.
        # Keep a raised heap for any residual Node tooling on the runner.
        run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
