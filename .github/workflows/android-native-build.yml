name: Android native build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-build.yml'
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-build.yml'

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-native

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and assemble debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :vara:assembleDebug --no-daemon --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sabq-android-unit-tests
          path: |
            android-native/app/build/reports/tests/testDebugUnitTest/**
            android-native/app/build/test-results/testDebugUnitTest/**
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sabq-debug-apk
          path: |
            android-native/app/build/outputs/apk/debug/*.apk
            android-native/vara/build/outputs/apk/debug/*.apk
          retention-days: 14
