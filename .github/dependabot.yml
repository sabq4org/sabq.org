# Dependabot — automated dependency updates + security-fix PRs.
# Security updates for vulnerable dependencies are opened automatically
# regardless of the schedule below (this is what clears the existing
# high/critical advisories the audit flagged).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Batch routine minor/patch bumps into one PR to cut noise; security
      # updates still come as their own dedicated PRs.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
