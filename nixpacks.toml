# Nixpacks build hints — kept as a fallback for environments without
# Docker (e.g. if a Railway service is later configured to skip the
# Dockerfile). Today's deployment uses Dockerfile (see railway.json),
# which produces the same headless server-only bundle.

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build:server"]

[start]
cmd = "node dist/index.js"
