# API origin proxy for the verified api.sabq.org cutover. The secret is a
# dashboard-managed binding and is intentionally absent from this file.
name = "sabq-api-origin"
main = "api-origin-worker.js"
compatibility_date = "2024-09-01"
account_id = "1ac069d5f5c7a3dd7f4e3c864f51446d"
workers_dev = false
routes = [
  { pattern = "api.sabq.org/*", zone_name = "sabq.org" },
]

# Run near the origin in US East (Render Virginia since 2026-10-21; Railway
# iad1 before). Europe ingress intermittently stalled for 20+ seconds.
[placement]
region = "aws:us-east-1"

[vars]
API_ORIGIN = "https://sabq-api-virginia.onrender.com"

[observability]
enabled = true
head_sampling_rate = 1
