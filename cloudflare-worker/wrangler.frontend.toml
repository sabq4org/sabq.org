# Frontend edge worker (Cloudflare → Vercel + api.sabq.org meta/body injection).
# Deploy:
#   cd cloudflare-worker
#   npx wrangler deploy --config wrangler.frontend.toml
#
# Do NOT use `--env production` — that creates a separate worker name
# (sabq-frontend-edge-production) and fails because sabq.org/* routes are
# already bound to sabq-frontend-edge.

name = "sabq-frontend-edge"
main = "frontend-edge-worker.js"
compatibility_date = "2024-09-01"
account_id = "1ac069d5f5c7a3dd7f4e3c864f51446d"

routes = [
  { pattern = "sabq.org/*", zone_name = "sabq.org" },
  { pattern = "www.sabq.org/*", zone_name = "sabq.org" }
]

[vars]
API_ORIGIN = "https://api.sabq.org"
FRONTEND_ORIGIN = "https://sabq.org"
