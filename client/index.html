    <!-- Suppress third-party script errors in development -->
    <script data-cfasync="false">
      (function() {
        var origin = location.origin;
        window.addEventListener('error', function(e) {
          var src = e.filename || '';
          var msg = e.message || '';
          var isExternal = !src || src.indexOf(origin) === -1 ||
              src.indexOf('googletagmanager') !== -1 ||
              src.indexOf('googlesyndication') !== -1 ||
              src.indexOf('doubleclick') !== -1;
          if (isExternal) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return false;
          }
          if (msg.indexOf('scroll-fade-in') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return false;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && typeof e.reason === 'object' && !e.reason.stack) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return false;
          }
        }, true);
      })();
    </script>

    <!--
      White-page safety net.
      This script LIVES IN THE HTML (not the bundle) so it runs even when
      the bundle itself fails to load — the exact scenario users hit after
      a deploy: their cached HTML still references chunk names that no
      longer exist on Vercel. The in-bundle handlers (main.tsx) never get
      a chance to register in that case. This script fills the gap:

        1. Unregister any legacy service worker that might be serving
           stale HTML pointing at dead chunks.
        2. Listen at the capture phase for <script src="/assets/*.js">
           load errors and force a cache-bust reload.
        3. After window.load, if React hasn't taken over <div id="root">,
           reload once; if reload budget is exhausted, render a visible
           recovery UI so the user is NEVER stuck on a silent white page.

      Hard limit: max 1 reload per 30s + max 3 per 5min to prevent loops.
      Once exhausted, the visible recovery UI gives the user a manual way
      out (clears storage, caches, and SWs, then reloads).
    -->
    <script data-cfasync="false">
      (function() {
        var RELOAD_TS_KEY = '__sabq_safety_reload_ts';
        var RELOAD_COUNT_KEY = '__sabq_safety_reload_count';
        var RELOAD_WINDOW_KEY = '__sabq_safety_reload_window';
        var MIN_GAP_MS = 30 * 1000;
        var MAX_PER_WINDOW = 3;
        var WINDOW_MS = 5 * 60 * 1000;
        var recoveryShown = false;

        function reloadWithBust() {
          try {
            var now = Date.now();
            var last = parseInt(sessionStorage.getItem(RELOAD_TS_KEY) || '0', 10);
            if (last && now - last < MIN_GAP_MS) return false;
            var winStart = parseInt(sessionStorage.getItem(RELOAD_WINDOW_KEY) || '0', 10);
            var count = parseInt(sessionStorage.getItem(RELOAD_COUNT_KEY) || '0', 10);
            if (!winStart || now - winStart > WINDOW_MS) {
              winStart = now; count = 0;
              sessionStorage.setItem(RELOAD_WINDOW_KEY, String(winStart));
            }
            if (count >= MAX_PER_WINDOW) return false;
            sessionStorage.setItem(RELOAD_TS_KEY, String(now));
            sessionStorage.setItem(RELOAD_COUNT_KEY, String(count + 1));
            var url = new URL(location.href);
            url.searchParams.set('_cb', String(now));
            location.replace(url.toString());
            return true;
          } catch (_) {
            try { location.reload(); return true; } catch (__) {}
            return false;
          }
        }

        function bootStalled() {
          // Boot is considered "stalled" if either:
          //  - root is empty (React mounted and crashed, clearing the shell), or
          //  - root still contains the instant-loader skeleton (React never
          //    replaced it). Without the second check, a fully-rendered
          //    skeleton looks identical to "loading" and the watchdog skips
          //    intervention even though the bundle silently died.
          var root = document.getElementById('root');
          if (!root) return false;
          if (root.childElementCount === 0) return true;
          var first = root.firstElementChild;
          if (first && first.classList && first.classList.contains('instant-loader')) {
            return true;
          }
          return false;
        }

        function escapeText(s) {
          var d = document.createElement('div'); d.textContent = s; return d.innerHTML;
        }

        function renderRecoveryUI() {
          if (recoveryShown) return;
          recoveryShown = true;
          var root = document.getElementById('root');
          if (!root) return;
          var bg = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? '#0a0a0a' : '#ffffff';
          var fg = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? '#fafafa' : '#0a0a0a';
          var mute = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? '#a3a3a3' : '#525252';
          root.innerHTML =
            '<div style="min-height:100vh;background:' + bg + ';color:' + fg + ';display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;font-family:\'IBM Plex Sans Arabic\',\'Tajawal\',-apple-system,BlinkMacSystemFont,sans-serif;direction:rtl">' +
              '<div style="font-size:48px;margin-bottom:16px" aria-hidden="true">⚠️</div>' +
              '<h1 style="font-size:24px;margin:0 0 12px;font-weight:700">تعذّر تحميل الصفحة</h1>' +
              '<p style="margin:0 0 24px;color:' + mute + ';max-width:480px;line-height:1.7;font-size:15px">يبدو أن متصفّحك يحتفظ بنسخة قديمة من الموقع بعد آخر تحديث. اضغط الزر بالأسفل لمسح الذاكرة المؤقتة وإعادة التحميل.</p>' +
              '<button id="__sabq_recover_btn" style="padding:12px 32px;background:#1a73e8;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit">مسح الذاكرة وإعادة التحميل</button>' +
              '<p style="margin:20px 0 0;color:' + mute + ';font-size:12px;direction:ltr">Ctrl+Shift+R / Cmd+Shift+R</p>' +
            '</div>';
          var btn = document.getElementById('__sabq_recover_btn');
          if (btn) {
            btn.addEventListener('click', function() {
              btn.disabled = true;
              btn.textContent = 'جارٍ المسح...';
              try { sessionStorage.clear(); } catch (_) {}
              try { localStorage.clear(); } catch (_) {}
              try {
                if ('caches' in window) {
                  caches.keys().then(function(keys) {
                    keys.forEach(function(k) { caches.delete(k).catch(function(){}); });
                  }).catch(function(){});
                }
              } catch (_) {}
              try {
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function(regs) {
                    regs.forEach(function(r) { r.unregister().catch(function(){}); });
                  }).catch(function(){});
                }
              } catch (_) {}
              setTimeout(function() {
                try {
                  var url = new URL(location.href);
                  url.searchParams.set('_cb', String(Date.now()));
                  location.replace(url.toString());
                } catch (_) { location.reload(); }
              }, 350);
            });
          }
        }

        // Unregister any stale service worker BEFORE the bundle tries to load.
        // We no longer ship a SW; if one exists, it's leftover from old builds
        // and may be intercepting and serving stale HTML.
        if ('serviceWorker' in navigator) {
          try {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              if (regs && regs.length) {
                regs.forEach(function(r) { r.unregister().catch(function(){}); });
              }
            }).catch(function(){});
          } catch (_) {}
        }

        // Safari-specific: bypass BFCache (Back/Forward Cache) restoration.
        //
        // WebKit aggressively keeps the previous page in memory even when
        // the server sends `Cache-Control: no-store`. When the user later
        // navigates back, taps a recent-app card, or relaunches the PWA,
        // Safari pulls the OLD HTML out of BFCache — which still
        // references the previous build's hashed JS chunks. Those chunks
        // no longer exist on Vercel after a deploy, so the page hangs in
        // a loading state. This was the dominant "loading after deploy"
        // signal coming from Safari users (the user confirmed
        // 2026-05-16). Firefox + Chrome respect no-store for BFCache, so
        // they don't see it.
        //
        // Fix: listen for `pageshow` with `event.persisted === true`
        // (the only reliable signal that the page came from BFCache) and
        // force a reload. This trades one extra round-trip for a working
        // page. The reload uses the cache-bust path so any stale edge
        // copy is bypassed too.
        window.addEventListener('pageshow', function(event) {
          if (event && event.persisted) {
            try { console.warn('[Sabq BFCache] Page restored from BFCache — reloading'); } catch (_) {}
            if (typeof reloadWithBust === 'function') {
              reloadWithBust();
            } else {
              location.reload();
            }
          }
        });

        // Catch <script src="/assets/*.js"> load failures. These are the
        // dominant signal that the HTML is referencing dead chunks.
        document.addEventListener('error', function(e) {
          var t = e.target;
          if (!t) return;
          if (t.tagName === 'SCRIPT' && t.src && t.src.indexOf(location.origin + '/assets/') === 0) {
            console.warn('[Sabq SafetyNet] Asset script failed to load: ' + t.src);
            if (!reloadWithBust()) renderRecoveryUI();
          }
          if (t.tagName === 'LINK' && t.href && t.href.indexOf(location.origin + '/assets/') === 0 && (t.rel === 'modulepreload' || t.rel === 'stylesheet')) {
            console.warn('[Sabq SafetyNet] Asset link failed to load: ' + t.href);
            if (!reloadWithBust()) renderRecoveryUI();
          }
        }, true);

        // Boot watchdog: poll twice (8s, 14s). If root is still empty or stuck
        // on the instant-loader skeleton, attempt a cache-bust reload. If the
        // reload budget is exhausted, render a visible recovery UI — never
        // leave the user staring at a silent white page.
        window.addEventListener('load', function() {
          setTimeout(function() {
            if (!bootStalled()) return;
            console.warn('[Sabq SafetyNet] Boot stalled 8s after load — attempting reload');
            if (!reloadWithBust()) {
              setTimeout(function() {
                if (bootStalled()) renderRecoveryUI();
              }, 1500);
            }
          }, 8000);
          // Second checkpoint: if the React app crashed mid-render after the
          // first watchdog already passed, the boundary above won't fire again.
          // This catches that case.
          setTimeout(function() {
            if (bootStalled() && !recoveryShown) {
              console.warn('[Sabq SafetyNet] Boot stalled 14s after load — recovery UI');
              if (!reloadWithBust()) renderRecoveryUI();
            }
          }, 14000);
        });
      })();
    </script>
    
    <!-- Google Analytics GA4 -->
    <!--
      Previously the gtag.js library load was wrapped in a 5-second
      setTimeout for Core Web Vitals optimisation. The `gtag()` calls
      below queued into dataLayer correctly, but nothing was actually
      transmitted to Google until the library finally loaded — so every
      visitor who bounced inside the first 5 seconds (a huge share of
      news traffic) was never counted.

      Loading the library immediately as `async` keeps the document
      parse non-blocking (modern browsers don't block on `async`), while
      ensuring the very first pageview from a fast-bounce visitor
      actually fires. SPA route changes are tracked separately from
      App.tsx — `send_page_view: false` here so we don't double-count.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EEB5593GY7" data-cfasync="false"></script>
    <script data-cfasync="false">
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-EEB5593GY7', {
        send_page_view: false,
        cookie_flags: 'SameSite=None;Secure'
      });
    </script>

    <!-- DEFERRED: Load GPT and GTM scripts on user interaction or after 5s -->
    <script data-cfasync="false">
      (function() {
        var loaded = false;
        function loadAdScripts() {
          if (loaded) return;
          loaded = true;
          var evts = ['scroll','click','touchstart','mousemove','keydown'];
          evts.forEach(function(e){ document.removeEventListener(e, loadAdScripts, {capture:true}); });
          var gpt = document.createElement('script');
          gpt.async = true;
          gpt.src = 'https://securepubads.g.doubleclick.net/tag/js/gpt.js';
          document.head.appendChild(gpt);
          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
          new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
          'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
          })(window,document,'script','dataLayer','GTM-T5PW84LM');
        }
        var evts = ['scroll','click','touchstart','mousemove','keydown'];
        evts.forEach(function(e){ document.addEventListener(e, loadAdScripts, {capture:true,once:true,passive:true}); });
        setTimeout(loadAdScripts, 5000);
      })();
    </script>

    <!--
      Font weights trimmed 2026-05-16 from 18 (IBM Plex 4 + Tajawal 3 +
      Inter 3 + Noto Naskh 4 + JetBrains Mono 4) down to 7 essentials.
      With Google Fonts splitting each weight across Latin + Arabic
      subsets, the old config easily downloaded 30+ woff2 files (~600KB)
      on first load — measurable LCP hit on mobile per the 2026-05-16
      GSC Core Web Vitals report (0 "fast" pages). Trimmed to what the
      app actually uses in CSS:
        - IBM Plex Sans Arabic: 400 + 700 (primary body + bold)
        - Tajawal: 700 (headlines only)
        - Inter: 400 + 600 (English UI)
        - JetBrains Mono: 400 (code blocks)
      Noto Naskh dropped entirely — IBM Plex covers Arabic. If a rare
      page needs additional weights it can lazy-load them on its own.
    -->
